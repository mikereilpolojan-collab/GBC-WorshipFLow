                                        <th className="p-4 font-medium">Username</th>
                                        <th className="p-4 font-medium">Role</th>
                                        <th className="p-4 font-medium">Status</th>
                                        <th className="p-4 font-medium text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {users.length === 0 ? (
                                        <tr><td colSpan="5" className="p-8 text-center text-gbc-muted">No users found.</td></tr>
                                    ) : (
                                        users.map(u => (
                                            <tr key={u.id} className="border-b border-gbc-border/50 hover:bg-gbc-surface/30">
                                                <td className="p-4 font-medium text-sm sm:text-base flex items-center gap-3">
                                                    <div className="w-8 h-8 rounded-full bg-gbc-border flex items-center justify-center text-xs text-gbc-muted shrink-0">{u.displayName?.charAt(0) || '?'}</div>
                                                    <span className="truncate">{u.displayName}</span>
                                                </td>
                                                <td className="p-4 text-gbc-muted text-sm">@{u.username}</td>
                                                <td className="p-4">
                                                    <span className={`text-xs px-2 py-1 rounded-full ${u.role === 'Director' ? 'bg-gbc-primary/20 text-gbc-primary' : 'bg-gbc-surface border border-gbc-border text-gbc-muted'}`}>
                                                        {u.role}
                                                    </span>
                                                </td>
                                                <td className="p-4">
                                                    <span className={`flex items-center gap-1.5 text-xs sm:text-sm ${u.status === 'Active' ? 'text-gbc-highlight' : 'text-gbc-error'}`}>
                                                        <span className={`w-2 h-2 rounded-full ${u.status === 'Active' ? 'bg-gbc-primary' : 'bg-gbc-error'}`}></span>
                                                        {u.status}
                                                    </span>
                                                </td>
                                                <td className="p-4 text-right space-x-2">
                                                    <Button variant="secondary" className="px-2 sm:px-3 py-1 text-xs inline-flex" onClick={() => openEdit(u)}>Edit</Button>
                                                    <Button variant="danger" className="px-2 sm:px-3 py-1 text-xs inline-flex" onClick={() => handleDeleteUser(u.id)}>
                                                        <Icon name="trash-2" size={14} />
                                                    </Button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title={editingUser ? "Edit User" : "Add New User"}>
                        <form onSubmit={handleSaveUser} className="space-y-4">
                            {error && <div className="bg-gbc-error/10 text-gbc-error p-3 rounded-md text-sm">{error}</div>}
                            <Input label="Display Name" required value={formData.displayName} onChange={e => setFormData({...formData, displayName: e.target.value})} />

                            {!editingUser && (
                                <>
                                    <Input label="Username" required value={formData.username} onChange={e => setFormData({...formData, username: e.target.value})} placeholder="e.g. john_doe" />
                                    <Input type="password" label="Password" required value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} />
                                </>
                            )}

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <Select label="Role" options={['Member', 'Director']} value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})} />
                                <Select label="Status" options={['Active', 'Inactive']} value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} />
                            </div>

                            <div className="flex justify-end gap-3 pt-4 border-t border-gbc-border">
                                <Button type="button" variant="secondary" onClick={() => setIsModalOpen(false)}>Cancel</Button>
                                <Button type="submit" disabled={loading}>{loading ? 'Saving...' : 'Save User'}</Button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        };

        const MainLayout = () => {
            const {userProfile, isDirector} = useAppContext();
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);

            const navItems = [
                {id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard'},
                {id: 'schedules', label: 'Schedules', icon: 'calendar-days'},
                {id: 'events', label: 'Other Events', icon: 'star'},
                {id: 'songs', label: 'Song Bank / Chords', icon: 'music'},
                {id: 'announcements', label: 'Announcements', icon: 'megaphone'},
            ];

            if (isDirector) {
                navItems.push({id: 'users', label: 'Manage Users', icon: 'users'});
            }

            const renderContent = () => {
                switch (activeTab) {
                    case 'dashboard': return <Dashboard />;
                    case 'schedules': return <ScheduleList type="weekly" />;
                    case 'events': return <ScheduleList type="special" />;
                    case 'songs': return <SongBank />;
                    case 'announcements': return <Announcements />;
                    case 'users': return isDirector ? <ManageUsers /> : <Dashboard />;
                    default: return <Dashboard />;
                }
            };

            return (
                <div className="flex h-screen overflow-hidden bg-transparent">
                    {/* Sidebar Desktop */}
                    <aside className="hidden md:flex w-64 flex-col border-r border-gbc-border bg-gbc-surface/30 backdrop-blur-xl z-20 shrink-0">
                        <div className="p-6 border-b border-gbc-border">
                            <div className="flex items-center gap-3">
                                <Logo href="#" size={80} />
                                <span className="font-heading font-bold text-lg tracking-tight">WorshipFlow</span>
                            </div>
                        </div>
                        <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                            {navItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 ${activeTab === item.id ? 'bg-gbc-primary/10 text-gbc-primary shadow-[inset_2px_0_0_0_#00C875]' : 'text-gbc-muted hover:text-gbc-text hover:bg-gbc-surface'}`}
                                >
                                    <Icon name={item.icon} size={18} className={activeTab === item.id ? 'text-gbc-primary' : 'opacity-70'} />
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gbc-border space-y-3">
                            <div className="flex items-center gap-3 px-2">
                                <div className="w-8 h-8 rounded-full bg-gbc-primary/20 text-gbc-primary border border-gbc-primary/30 flex items-center justify-center font-bold text-xs shrink-0">
                                    {userProfile?.displayName?.charAt(0) || 'U'}
                                </div>
                                <div className="flex-1 overflow-hidden">
                                    <p className="text-sm font-semibold text-gbc-text truncate">{userProfile?.displayName || 'Worship Team Member'}</p>
                                    <p className="text-xs text-gbc-muted truncate">{userProfile?.role || 'Member'}</p>
                                </div>
                            </div>
                            <Button variant="secondary" className="w-full text-sm py-2" onClick={() => signOut(auth)}>
                                <Icon name="log-out" size={14} /> Sign Out
                            </Button>
                        </div>
                    </aside>

                    {/* Mobile Header & Content */}
                    <div className="flex-1 flex flex-col min-w-0 z-20">
                        <header className="md:hidden flex items-center justify-between p-4 border-b border-gbc-border bg-gbc-surface/80 backdrop-blur-md sticky top-0 z-30">
                            <div className="flex items-center gap-2">
                                <Logo href="#" size={28} />
                                <span className="font-heading font-bold text-sm sm:text-base">WorshipFlow</span>
                            </div>
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-gbc-text p-1">
                                <Icon name={isMobileMenuOpen ? "x" : "menu"} size={24} />
                            </button>
                        </header>

                        {isMobileMenuOpen && (
                            <div className="md:hidden absolute top-[65px] left-0 w-full h-[calc(100vh-65px)] bg-gbc-bg/95 backdrop-blur-xl z-40 p-4 flex flex-col overflow-y-auto">
                                <nav className="flex-1 space-y-2">
                                    {navItems.map(item => (
                                        <button key={item.id} onClick={() => {setActiveTab(item.id); setIsMobileMenuOpen(false);}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-base font-medium ${activeTab === item.id ? 'bg-gbc-primary/10 text-gbc-primary border border-gbc-primary/20' : 'text-gbc-muted'}`}>
                                            <Icon name={item.icon} size={20} /> {item.label}
                                        </button>
                                    ))}
                                </nav>
                                <div className="pt-4 mt-auto border-t border-gbc-border space-y-3">
                                    <div className="flex items-center gap-3 px-2">
                                        <div className="w-8 h-8 rounded-full bg-gbc-primary/20 text-gbc-primary border border-gbc-primary/30 flex items-center justify-center font-bold text-xs shrink-0">
                                            {userProfile?.displayName?.charAt(0) || 'U'}
                                        </div>
                                        <div className="flex-1 overflow-hidden">
                                            <p className="text-sm font-semibold text-gbc-text truncate">{userProfile?.displayName || 'Worship Team Member'}</p>
                                            <p className="text-xs text-gbc-muted truncate">{userProfile?.role || 'Member'}</p>
                                        </div>
                                    </div>
                                    <Button variant="secondary" className="w-full" onClick={() => signOut(auth)}>Sign Out</Button>
                                </div>
                            </div>
                        )}

                        <main className="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 lg:p-10 relative">
                            <div className="max-w-6xl mx-auto relative z-10">
                                {renderContent()}
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const App = () => {
            const {user, loading} = useAppContext();

            if (loading) {
                return <div className="h-screen flex items-center justify-center bg-transparent text-gbc-primary"><Icon name="loader-2" className="animate-spin" size={40} /></div>;
            }

            return (
                <>
                    <ParticleBackground />
                    {user ? <MainLayout /> : <LoginScreen />}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AppProvider>
                <App />
            </AppProvider>
        );
    </script>
</body>

</html>
